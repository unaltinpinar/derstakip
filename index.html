:root{--bg:#f2f7fd;--card:#fff;--ink:#0b1f3a;--muted:#4f5d75;--line:#d6e2f1;--soft:#e6f0fb;--brand:#0f2a4d;--brand-2:#1b4a86;--on-brand:#fff;--blue:#2f6db5;--sky:#cfe3f8;--or:#f26a1b;--or-d:#d95e12;--or-ink:#b4490a;--on-or:#0b1f3a;--gold:var(--or);--gold-ink:var(--or-ink);--red:#b3261e;--warn:#7a3b06;--warnbg:#fff2e6;--focus:#1f5fb0;--hdr-ink:#fff;--hdr-mut:#c6dcf5;--shadow:0 1px 2px rgba(15,42,77,.05),0 12px 28px -18px rgba(15,42,77,.28);--sans:Outfit,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0a1426;--card:#112038;--ink:#eaf1fb;--muted:#a9b9d0;--line:#26395a;--soft:#172a47;--brand:#9cc3ec;--brand-2:#c3dcf6;--on-brand:#0a1426;--blue:#6fa6e6;--sky:#24406b;--or:#ff8a3d;--or-d:#ff9d5c;--or-ink:#ffb27a;--on-or:#0a1426;--red:#ff9a8f;--warn:#ffd2ad;--warnbg:#2a1c10;--focus:#9cc3ec;--hdr-ink:#fff;--hdr-mut:#c6dcf5;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -18px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--sans);letter-spacing:-.005em}
.skip{position:absolute;left:-999px;top:0;background:var(--or);color:var(--on-or);padding:8px 12px;z-index:50}
.skip:focus{left:8px;top:8px}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
header.top{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#0f2a4d,#1b4a86);color:var(--hdr-ink);border-radius:18px;padding:24px 28px;margin-bottom:18px;box-shadow:var(--shadow)}
header.top::after{content:"";position:absolute;right:-34px;top:-56px;width:180px;height:180px;border-radius:50%;background:var(--or);opacity:.92}
header.top>*{position:relative;z-index:1}
header.top h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
header.top .sub,header.top .hint{color:var(--hdr-mut)}
header.top .hint{margin-top:4px}
.kod{display:inline-block;font-weight:800;letter-spacing:.08em;background:#fff;color:#0f2a4d;border-radius:999px;padding:5px 18px;font-size:14px}
.sub{color:var(--muted);font-size:13.5px;margin-top:2px}
nav.sekmeler{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
nav.sekmeler button{font:inherit;font-weight:700;font-size:15px;min-height:44px;padding:8px 20px;border:none;border-radius:999px;background:var(--soft);color:var(--brand);cursor:pointer;transition:background .15s,color .15s}
nav.sekmeler button:hover{background:var(--sky)}
nav.sekmeler button[aria-current=page]{background:var(--or);color:var(--on-or)}
button,select,input,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{min-height:44px;padding:8px 22px;border-radius:10px;border:1.5px solid var(--brand);background:var(--card);color:var(--brand);font-weight:700;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.birincil{background:var(--or);border-color:var(--or);color:var(--on-or);font-weight:800;box-shadow:0 6px 14px -8px var(--or)}
.btn.birincil:hover:not(:disabled){background:var(--or-d);border-color:var(--or-d)}
.btn.tehlike{border-color:var(--red);color:var(--red)}
.btn.tehlike:hover:not(:disabled){background:var(--soft)}
.btn.kucuk{min-height:36px;padding:4px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.kart,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 0 18px;box-shadow:var(--shadow)}
.card h2{margin:0 0 14px;font-size:20px;font-weight:800;line-height:1.25;color:var(--brand);display:flex;align-items:center;gap:10px}
.card h2::before{content:"";flex:none;width:5px;height:20px;border-radius:3px;background:var(--or)}
.card h3{margin:18px 0 8px;font-size:15.5px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:var(--shadow)}
.stat:nth-child(4){background:#0f2a4d;border-color:#0f2a4d}
.stat:nth-child(4) .stat-l,.stat:nth-child(4) .stat-n{color:#c6dcf5}
.stat:nth-child(4) .stat-v{color:#fff}
.stat-l{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.stat-v{font-size:34px;font-weight:800;line-height:1.2;color:var(--brand);font-variant-numeric:lining-nums tabular-nums}
.stat-n{font-size:13px;color:var(--muted)}
.notice{background:var(--warnbg);color:var(--warn);border:1px solid var(--or);border-left-width:5px;border-radius:10px;padding:10px 14px;margin-bottom:16px}
.errbox{background:var(--card);border:1px solid var(--red);border-left-width:5px;border-radius:10px;padding:10px 14px;margin:12px 0}
.errbox ul{margin:6px 0 0;padding-left:20px}
.okbox{border:1px solid var(--blue);border-left-width:5px;border-radius:8px;padding:12px 16px;margin:12px 0;background:var(--soft)}
.bos{color:var(--muted);margin:0}
.form{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:700;letter-spacing:.01em;color:var(--ink)}
.field input,.field select,.field textarea,.toolbar select,.row select,.row input{min-height:44px;padding:8px 12px;border:1.5px solid #b3c6df;border-radius:10px;background:var(--card);width:100%;transition:border-color .15s,box-shadow .15s}
@media (prefers-color-scheme:dark){.field input,.field select,.field textarea,.toolbar select,.row select,.row input{border-color:#3a527a}}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--brand)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent);outline:none}
.field textarea{min-height:80px;resize:vertical}
.hint{color:var(--muted);font-size:13px}
.toplam{font-weight:600;font-variant-numeric:tabular-nums;background:var(--soft);border-left:4px solid var(--or);border-radius:8px;padding:9px 14px}
.toggle{display:inline-flex;margin-bottom:18px;background:var(--soft);border-radius:999px;padding:4px}
.toggle button{min-height:40px;padding:6px 24px;font-weight:700;border:none;border-radius:999px;background:transparent;color:var(--brand);cursor:pointer;transition:background .15s,color .15s}
.toggle button[aria-pressed=true]{background:var(--or);color:var(--on-or);box-shadow:0 4px 10px -4px var(--or)}
.grp{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.grp-head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.grp-head select{max-width:260px;min-height:40px;border:1.5px solid #b3c6df;border-radius:10px;padding:6px 10px;background:var(--card)}
.row{display:grid;grid-template-columns:90px minmax(90px,120px) 1fr;gap:8px;align-items:start;margin-bottom:8px}
.row .lbl{font-weight:600;padding-top:11px;font-size:13.5px;color:var(--muted)}
.row .ac{grid-column:2 / 4;font-size:13px;color:var(--muted);min-height:1em}
.dersk{border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:12px;padding:14px 16px;margin-bottom:14px;background:var(--card)}
.dersk h3{margin:0 0 10px;font-size:18px;font-weight:700;color:var(--brand)}
.dersk .calc{font-variant-numeric:tabular-nums;font-weight:600;align-self:end;padding-bottom:10px}
.tablo-kap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{background:var(--soft);color:var(--brand);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;border-bottom:2px solid var(--or)}
tbody tr:hover td{background:color-mix(in srgb,var(--soft) 60%,transparent)}
td.sayi,th.sayi{text-align:right;font-variant-numeric:tabular-nums}
td.b{font-weight:700}
tr.az td{color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;min-width:70px}
.bar .fill{height:100%;background:var(--blue);border-radius:4px}
.bar-t{font-size:12px;color:var(--muted)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(120px,190px) 1fr 80px;gap:10px;align-items:center;font-size:14px}
.hbar-n{text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px}
.toolbar select{width:auto;min-width:160px}
.uyari-liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.etiket{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);color:var(--brand);border-radius:999px;padding:1px 9px;margin-right:6px}
li.uyari .etiket{background:#fff1e6;color:var(--or-ink)}
@media (prefers-color-scheme:dark){li.uyari .etiket{background:#3a2412}}
.chart{width:100%;height:auto;max-height:260px}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-bar{fill:var(--blue);opacity:.38}.ch-bar.cur{fill:var(--or);opacity:1}
.ch-txt{fill:var(--ink);font-size:11px}.ch-txt.b{font-weight:700}
.ch-mut{fill:var(--muted);font-size:11px}
.ch-red{fill:var(--or-ink);font-size:11px;font-weight:700}
.ch-hedef{stroke:var(--or);stroke-width:2;stroke-dasharray:6 4}
.ch-line{stroke:var(--blue);stroke-width:2.5}
.ch-dot{fill:var(--or);stroke:var(--card);stroke-width:2}
.liste{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.liste li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center;background:var(--card)}
details{margin:6px 0}
summary{cursor:pointer;min-height:32px;color:var(--brand);font-weight:700}
pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);padding:12px;border-radius:8px;font-size:12px;max-height:280px;overflow:auto}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:0 4px 4px 0;background:var(--soft)}
.kutu-iki{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f2a4d;color:#fff;border-bottom:3px solid var(--or);padding:11px 20px;border-radius:10px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;box-shadow:0 10px 30px -8px rgba(0,0,0,.5)}

<script>
/* SUNUCU ADRESİ: Apps Script dağıtımından aldığın 'Web uygulaması URL'sini iki tırnak arasına yapıştır. Boş bırakırsan dosya modunda çalışır. */
window.LGS_SUNUCU = 'https://script.google.com/macros/s/AKfycbyRoLsNxJgY8jIhO1CARxAACebZkpSGtoBLow17ruT3sN2cd4cFwAW9RPWhkHzK3glVrw/exec';
</script>
<script>
/* LGS Takip — ortak çekirdek: veri modeli, doğrulama, analiz, aktarım.
   Hem ogrenci.html hem koc.html içine gömülür. Tarayıcıda ve Node'da çalışır. */
const LGS = (function () {
'use strict';

const KONU_SURUM = '2026-11-01';
const HAFTA_BASLANGIC = 6; // 0 Pazar … 6 Cumartesi: hafta Cumartesi–Cuma

const DERSLER = [
  { id: 'tur', ad: 'Türkçe', soru: 20, grup: 'sozel' },
  { id: 'mat', ad: 'Matematik', soru: 20, grup: 'sayisal' },
  { id: 'fen', ad: 'Fen Bilimleri', soru: 20, grup: 'sayisal' },
  { id: 'ink', ad: 'İnkılap Tarihi', soru: 10, grup: 'sozel' },
  { id: 'din', ad: 'Din Kültürü', soru: 10, grup: 'sozel' },
  { id: 'ing', ad: 'İngilizce', soru: 10, grup: 'sozel' }
];

// Kaynak: 2027 LGS konu listeleri (resmî olmayan derleme) — öğretmen düzenlemelidir.
const KONULAR = {
  tur: ['Sözcükte Anlam', 'Cümlede Anlam', 'Paragrafta Anlam', 'Parçada Yapı ve Anlatım', 'Fiilimsi',
    'Cümlenin Ögeleri', 'Fiil Çatısı', 'Cümle Türleri', 'Anlatım Bozukluğu', 'Yazım Kuralları',
    'Noktalama İşaretleri', 'Metin Türleri', 'Söz Sanatları', 'Deyimler ve Atasözleri',
    'Grafik, Tablo ve Görsel-Sözel Mantık'],
  mat: ['Çarpanlar ve Katlar', 'Üslü İfadeler', 'Kareköklü İfadeler', 'Veri Analizi', 'Olasılık',
    'Cebirsel İfadeler ve Özdeşlikler', 'Doğrusal Denklemler', 'Eşitsizlikler', 'Üçgenler',
    'Eşlik ve Benzerlik', 'Dönüşüm Geometrisi', 'Geometrik Cisimler'],
  fen: ['Mevsimler ve İklim', 'DNA ve Genetik Kod', 'Basınç', 'Madde ve Endüstri', 'Basit Makineler',
    'Enerji Dönüşümleri ve Çevre Bilimi', 'Elektrik Yükleri ve Elektrik Enerjisi'],
  ink: ['Bir Kahraman Doğuyor', 'Milli Uyanış', 'Ya İstiklal Ya Ölüm!', 'Atatürkçülük ve Çağdaşlaşan Türkiye',
    'Demokratikleşme Çabaları', 'Atatürk Dönemi Türk Dış Politikası', "Atatürk'ün Ölümü ve Sonrası"],
  din: ['Kader İnancı', 'Zekât ve Sadaka', 'Din ve Hayat', "Hz. Muhammed'in Örnekliği",
    "Kur'an-ı Kerim ve Özellikleri"],
  ing: ['Friendship', 'Teen Life', 'In The Kitchen', 'On The Phone', 'The Internet', 'Adventures',
    'Tourism', 'Chores', 'Science', 'Natural Forces']
};

const NEDEN_Y = [
  { id: 'bilgi', ad: 'Bilgi eksiği', ac: 'Konuyu veya formülü bilmiyordum / unutmuştum' },
  { id: 'kavram', ad: 'Kavram yanılgısı', ac: 'Yanlış öğrenmişim, yanlış kural uyguladım' },
  { id: 'islem', ad: 'İşlem hatası', ac: 'Yöntem doğruydu, hesapta veya adımda hata yaptım' },
  { id: 'dikkat', ad: 'Dikkat / okuma hatası', ac: 'Soruyu veya seçenekleri yanlış okudum' },
  { id: 'sure', ad: 'Süre / acele', ac: 'Acele ettim ya da süre baskısı vardı' },
  { id: 'tip', ad: 'Soru tipine yabancılık', ac: 'Bu tür soruyu (yeni nesil, grafik vb.) ilk kez gördüm' }
];
const NEDEN_B = [
  { id: 'bilgi', ad: 'Bilgi eksiği', ac: 'Konuyu bilmediğim için denemedim' },
  { id: 'emin', ad: 'Emin değildim', ac: 'Çözebilirdim ama emin olamadığım için boş bıraktım' },
  { id: 'sure', ad: 'Süre yetmedi', ac: 'Süre bittiği için soruya ulaşamadım' },
  { id: 'tip', ad: 'Soru tipine yabancılık', ac: 'Soru tipini tanımadım' }
];

/* ---------- Küçük yardımcılar ---------- */
const pad = n => String(n).padStart(2, '0');
const isInt = n => Number.isInteger(n);
const r2 = x => Math.round(x * 100) / 100;
const net = (d, y) => r2(d - y / 3);
const kisalt = (s, n) => (typeof s === 'string' ? s.trim().slice(0, n) : '');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = (n, d = 2) => (n == null || isNaN(n) ? '–' : Number(n).toFixed(d).replace('.', ','));
const dersBul = id => DERSLER.find(d => d.id === id) || null;
const nedenListesi = sonuc => (sonuc === 'b' ? NEDEN_B : NEDEN_Y);
const nedenAd = id => {
  if (!id) return 'Belirtilmemiş';
  const x = NEDEN_Y.find(n => n.id === id) || NEDEN_B.find(n => n.id === id);
  return x ? x.ad : id;
};

function bugun() {
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}
function tarihGecerli(s) {
  if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() === y && t.getUTCMonth() === m - 1 && t.getUTCDate() === d;
}
const gunNo = s => { const [y, m, d] = s.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 86400000); };
const farkGun = (a, b) => gunNo(a) - gunNo(b);
function gunEkle(s, n) {
  const d = new Date((gunNo(s) + n) * 86400000);
  return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
}
function haftaBasi(s) {
  const dow = new Date(gunNo(s) * 86400000).getUTCDay();
  return gunEkle(s, -((dow - HAFTA_BASLANGIC + 7) % 7));
}
function tarihTR(s) {
  if (!tarihGecerli(s)) return '';
  const [y, m, d] = s.split('-');
  return d + '.' + m + '.' + y;
}

/* ---------- Doğrulama ---------- */
function oturumDogrula(o, ref) {
  const e = [];
  if (!o || typeof o !== 'object') return ['Kayıt okunamadı'];
  if (typeof o.id !== 'string' || !/^[a-z0-9]{6,40}$/.test(o.id)) e.push('Kayıt kimliği geçersiz');
  if (!tarihGecerli(o.tarih)) e.push('Tarih geçersiz');
  else if (farkGun(o.tarih, ref || bugun()) > 0) e.push('Tarih gelecekte olamaz');
  if (o.tur !== 'konu' && o.tur !== 'deneme') e.push('Tür geçersiz');
  if (o.sure != null && !(isInt(o.sure) && o.sure > 0 && o.sure <= 600)) e.push('Süre 1–600 dakika arasında olmalı');
  if (!Array.isArray(o.bolumler) || !o.bolumler.length) { e.push('Ders bölümü yok'); return e; }
  if (!Array.isArray(o.hatalar)) { e.push('Hata listesi yok'); return e; }
  if (o.tur === 'konu' && o.bolumler.length !== 1) e.push('Konu çalışması tek ders içermeli');
  if (o.tur === 'deneme' && o.bolumler.length !== DERSLER.length) e.push('Denemede altı dersin de sonucu girilmeli');
  const gorulen = new Set();
  for (const b of o.bolumler) {
    const ders = dersBul(b && b.ders);
    if (!ders) { e.push('Ders geçersiz'); continue; }
    if (gorulen.has(ders.id)) e.push(ders.ad + ' iki kez girilmiş');
    gorulen.add(ders.id);
    const ad = ders.ad;
    if (![b.soru, b.d, b.y, b.b].every(isInt) || b.soru <= 0 || b.d < 0 || b.y < 0 || b.b < 0) {
      e.push(ad + ': sayılar geçersiz'); continue;
    }
    if (b.d + b.y + b.b !== b.soru) e.push(ad + ': doğru + yanlış + boş = ' + (b.d + b.y + b.b) + ', soru sayısı ' + b.soru);
    if (o.tur === 'deneme' && b.soru !== ders.soru) e.push(ad + ': denemede ' + ders.soru + ' soru olmalı');
    if (o.tur === 'konu' && (typeof b.konu !== 'string' || !b.konu)) e.push(ad + ': konu seçilmemiş');
    const hs = o.hatalar.filter(h => h && h.ders === ders.id);
    const hy = hs.filter(h => h.sonuc === 'y').length;
    const hb = hs.filter(h => h.sonuc === 'b').length;
    if (hy !== b.y || hb !== b.b || hs.length !== hy + hb) e.push(ad + ': hatalı soru satırları yanlış/boş sayısıyla uyuşmuyor');
    const nolar = new Set();
    for (const h of hs) {
      const ids = nedenListesi(h.sonuc).map(n => n.id);
      if (h.neden != null && !ids.includes(h.neden)) e.push(ad + ': hata nedeni geçersiz');
      if (h.no != null) {
        const ust = o.tur === 'deneme' ? ders.soru : 500;
        if (!isInt(h.no) || h.no < 1 || h.no > ust) e.push(ad + ': soru no 1–' + ust + ' arasında olmalı');
        else if (o.tur === 'deneme') {
          if (nolar.has(h.no)) e.push(ad + ': ' + h.no + '. soru iki kez girilmiş');
          nolar.add(h.no);
        }
      } else if (o.tur === 'deneme') e.push(ad + ': hatalı soruların numarası girilmeli');
    }
  }
  return e;
}

function temizKonular(k) {
  const c = {};
  for (const [ad, n] of Object.entries(k || {})) {
    const a = kisalt(ad, 80);
    if (a && isInt(n) && n >= 0 && n <= 50) c[a] = n;
  }
  return c;
}
function temizOturum(o, ref) {
  if (!o || typeof o !== 'object') return null;
  const c = {
    id: o.id, tarih: o.tarih, tur: o.tur,
    kaynak: kisalt(o.kaynak, 80), ad: kisalt(o.ad, 80),
    tanimId: typeof o.tanimId === 'string' ? kisalt(o.tanimId, 40) : null,
    sure: o.sure == null ? null : Number(o.sure), not: kisalt(o.not, 300),
    bolumler: (Array.isArray(o.bolumler) ? o.bolumler : []).map(b => ({
      ders: b && b.ders, konu: b && typeof b.konu === 'string' ? kisalt(b.konu, 80) : null,
      soru: Number(b && b.soru), d: Number(b && b.d), y: Number(b && b.y), b: Number(b && b.b),
      konular: b && b.konular && typeof b.konular === 'object' ? temizKonular(b.konular) : null
    })),
    hatalar: (Array.isArray(o.hatalar) ? o.hatalar : []).map(h => ({
      ders: h && h.ders, konu: h && typeof h.konu === 'string' ? kisalt(h.konu, 80) : null,
      no: h && h.no != null ? Number(h.no) : null, sonuc: h && h.sonuc, neden: h && h.neden != null ? h.neden : null
    }))
  };
  return oturumDogrula(c, ref).length ? null : c;
}

function tanimDogrula(t) {
  if (!t || typeof t !== 'object') return null;
  if (typeof t.id !== 'string' || !/^[a-z0-9]{6,40}$/.test(t.id)) return null;
  const ad = kisalt(t.ad, 80);
  if (!ad) return null;
  const harita = {};
  for (const d of DERSLER) {
    const a = t.harita && t.harita[d.id];
    if (!Array.isArray(a) || a.length !== d.soru) return null;
    harita[d.id] = a.map(x => (typeof x === 'string' && x ? kisalt(x, 80) : null));
  }
  return { id: t.id, ad, tarih: tarihGecerli(t.tarih) ? t.tarih : null, harita };
}
function konuSayilari(haritaDers) {
  const m = {};
  for (const k of haritaDers) if (k) m[k] = (m[k] || 0) + 1;
  return m;
}

/* ---------- Analiz ---------- */
function sirala(oturumlar) {
  return oturumlar.slice().sort((a, b) => (a.tarih === b.tarih ? (a.id < b.id ? -1 : 1) : a.tarih < b.tarih ? -1 : 1));
}

function konuIstatistik(oturumlar) {
  const m = new Map();
  const al = (ders, konu) => {
    const key = ders + '|' + konu;
    if (!m.has(key)) m.set(key, { ders, konu, soru: 0, d: 0, y: 0, b: 0, sure: 0, sureSoru: 0, oturum: 0, son: null });
    return m.get(key);
  };
  for (const o of oturumlar) {
    for (const b of o.bolumler) {
      if (o.tur === 'konu') {
        const k = al(b.ders, b.konu);
        k.soru += b.soru; k.d += b.d; k.y += b.y; k.b += b.b; k.oturum++;
        if (o.sure) { k.sure += o.sure; k.sureSoru += b.soru; }
        if (!k.son || o.tarih > k.son) k.son = o.tarih;
      } else if (b.konular) {
        for (const [konu, n] of Object.entries(b.konular)) {
          const hs = o.hatalar.filter(h => h.ders === b.ders && h.konu === konu);
          const hy = hs.filter(h => h.sonuc === 'y').length;
          const hb = hs.length - hy;
          const k = al(b.ders, konu);
          k.soru += n; k.y += hy; k.b += hb; k.d += Math.max(0, n - hy - hb); k.oturum++;
          if (!k.son || o.tarih > k.son) k.son = o.tarih;
        }
      }
    }
  }
  return [...m.values()].map(k => ({
    ...k, basari: k.soru ? k.d / k.soru : null, hiz: k.sure > 0 ? k.sureSoru / k.sure : null
  }));
}

function dersHizi(oturumlar) {
  const m = {};
  for (const o of oturumlar) {
    if (o.tur !== 'konu' || !o.sure) continue;
    const b = o.bolumler[0];
    const x = (m[b.ders] = m[b.ders] || { ders: b.ders, soru: 0, sure: 0 });
    x.soru += b.soru; x.sure += o.sure;
  }
  return DERSLER.filter(d => m[d.id]).map(d => ({ ...m[d.id], hiz: m[d.id].soru / m[d.id].sure }));
}

function denemeListesi(oturumlar) {
  return sirala(oturumlar).filter(o => o.tur === 'deneme').map(o => {
    const dersNet = {}; let d = 0, y = 0, b = 0, sozel = 0, sayisal = 0;
    for (const bl of o.bolumler) {
      const n = net(bl.d, bl.y);
      dersNet[bl.ders] = n; d += bl.d; y += bl.y; b += bl.b;
      if (dersBul(bl.ders).grup === 'sozel') sozel += n; else sayisal += n;
    }
    return { id: o.id, ad: o.ad || 'Deneme', tarih: o.tarih, sure: o.sure, d, y, b, net: net(d, y), dersNet, sozel: r2(sozel), sayisal: r2(sayisal) };
  });
}

function hataDagilimi(oturumlar) {
  const toplam = {}; const dersler = {}; let adet = 0;
  for (const o of oturumlar) {
    for (const h of o.hatalar) {
      adet++;
      const n = h.neden || 'belirsiz';
      toplam[n] = (toplam[n] || 0) + 1;
      dersler[h.ders] = dersler[h.ders] || {};
      dersler[h.ders][n] = (dersler[h.ders][n] || 0) + 1;
    }
  }
  return { adet, toplam, dersler };
}

function haftalar(oturumlar, ref, n) {
  n = n || 8;
  const son = haftaBasi(ref);
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push({ bas: gunEkle(son, -7 * i), soru: 0, konu: 0, deneme: 0, oturum: 0, guncel: i === 0 });
  const idx = new Map(out.map(w => [w.bas, w]));
  for (const o of oturumlar) {
    const w = idx.get(haftaBasi(o.tarih));
    if (!w) continue;
    const s = o.bolumler.reduce((a, b) => a + b.soru, 0);
    w.soru += s; w.oturum++;
    if (o.tur === 'konu') w.konu += s; else w.deneme += s;
  }
  return out;
}

function tekrarListesi(oturumlar, ref) {
  return konuIstatistik(oturumlar).filter(k => k.son).map(k => ({ ders: k.ders, konu: k.konu, son: k.son, gun: farkGun(ref, k.son) }))
    .filter(k => (k.gun >= 7 && k.gun <= 13) || (k.gun >= 21 && k.gun <= 27))
    .map(k => ({ ...k, tur: k.gun <= 13 ? '1 hafta' : '3 hafta' }));
}

/* Konu trendi: son 14 gün ile ondan önceki 21 günün başarı karşılaştırması.
   Her iki pencerede en az 10 soru yoksa 'yetersiz'; fark 15 puan ve üzerindeyse yükseliyor/geriliyor sayılır. */
const TREND = { sonGun: 14, oncekiGun: 21, minSoru: 10, esik: 0.15 };
const TREND_SIRA = { geriliyor: 0, yukseliyor: 1, sabit: 2, yetersiz: 3 };
function baskinNeden(oturumlar, ders, konu) {
  const c = {};
  for (const o of oturumlar) for (const h of o.hatalar) {
    if (h.ders === ders && h.konu === konu && h.neden) c[h.neden] = (c[h.neden] || 0) + 1;
  }
  let m = null, v = 0;
  for (const [k, x] of Object.entries(c)) if (x > v) { m = k; v = x; }
  return m ? { neden: m, adet: v } : null;
}
function konuTrend(oturumlar, ref) {
  ref = ref || bugun();
  const sonBas = gunEkle(ref, -(TREND.sonGun - 1));
  const oncBit = gunEkle(sonBas, -1);
  const oncBas = gunEkle(oncBit, -(TREND.oncekiGun - 1));
  const pencere = (a, b) => oturumlar.filter(o => o.tarih >= a && o.tarih <= b);
  const sonO = pencere(sonBas, ref), oncO = pencere(oncBas, oncBit);
  const oncMap = new Map(konuIstatistik(oncO).map(k => [k.ders + '|' + k.konu, k]));
  return konuIstatistik(sonO).filter(k => k.soru > 0).map(k => {
    const o = oncMap.get(k.ders + '|' + k.konu) || null;
    const yeterli = k.soru >= TREND.minSoru && !!o && o.soru >= TREND.minSoru;
    const fark = yeterli ? k.basari - o.basari : null;
    return {
      ders: k.ders, konu: k.konu,
      son: { soru: k.soru, basari: k.basari }, onceki: o ? { soru: o.soru, basari: o.basari } : null, fark,
      durum: !yeterli ? 'yetersiz' : fark >= TREND.esik ? 'yukseliyor' : fark <= -TREND.esik ? 'geriliyor' : 'sabit',
      nedenSon: baskinNeden(sonO, k.ders, k.konu), nedenOnceki: o ? baskinNeden(oncO, k.ders, k.konu) : null
    };
  }).sort((a, b) => (TREND_SIRA[a.durum] - TREND_SIRA[b.durum]) || ((a.fark || 0) - (b.fark || 0)));
}

function uyarilar(oturumlar, hedef, ref) {
  const u = [];
  const ds = sirala(oturumlar);
  const son = ds.length ? ds[ds.length - 1].tarih : null;
  const ilk = ds.length ? ds[0].tarih : null;
  if (!ds.length) u.push({ kod: 'giris-yok', seviye: 'uyari', metin: 'Hiç kayıt yok' });
  else {
    const g = farkGun(ref, son);
    if (g >= 7) u.push({ kod: 'giris-yok', seviye: 'uyari', metin: g + ' gündür kayıt yok' });
  }
  if (ds.length && hedef && hedef.haftalikSoru > 0) {
    const hf = haftalar(oturumlar, ref, 2);
    const onceki = hf[0];
    if (ilk <= onceki.bas && onceki.soru < 0.7 * hedef.haftalikSoru) {
      u.push({ kod: 'hedef-alti', seviye: 'uyari', metin: 'Geçen hafta ' + onceki.soru + ' soru (hedef ' + hedef.haftalikSoru + ')' });
    }
  }
  const dl = denemeListesi(oturumlar);
  if (dl.length >= 2) {
    const a = dl[dl.length - 1], b = dl[dl.length - 2];
    if (a.net <= b.net - 3) u.push({ kod: 'net-dusus', seviye: 'uyari', metin: 'Son deneme neti ' + fmt(a.net) + ' (öncekine göre ' + fmt(a.net - b.net) + ')' });
  }
  const hd = hataDagilimi(oturumlar);
  const bilinen = hd.adet - (hd.toplam.belirsiz || 0);
  if (hd.adet >= 10 && (hd.toplam.belirsiz || 0) / hd.adet > 0.5) {
    u.push({ kod: 'neden-eksik', seviye: 'bilgi', metin: 'Hataların çoğunda neden girilmemiş' });
  }

    for (const [k, v] of Object.entries(hd.toplam)) if (k !== 'belirsiz' && v > mv) { mk = k; mv = v; }
    if (mk && mv / bilinen >= 0.4) u.push({ kod: 'baskin-hata', seviye: 'bilgi', metin: 'Hataların %' + Math.round(100 * mv / bilinen) + "'i: " + nedenAd(mk) });
  }
  konuIstatistik(oturumlar).filter(k => k.soru >= 10 && k.oturum >= 2 && k.basari < 0.5)
    .sort((a, b) => a.basari - b.basari).slice(0, 3)
    .forEach(k => u.push({ kod: 'zayif-konu', seviye: 'uyari', metin: dersBul(k.ders).ad + ' · ' + k.konu + ': %' + Math.round(100 * k.basari) + ' (' + k.soru + ' soru)' }));
  const tr = konuTrend(ds, ref);

}

function ozet(oturumlar, hedef, ref) {

const AI_ISTEM = 'Sen, LGS hazırlık sürecinde öğretmene yardım eden bir analiz asistanısın. Aşağıdaki JSON, bir öğrencinin (yalnızca kodla anılır) çalışma ve deneme özetidir. Tüm sayılar kodla hesaplanmıştır; yeniden hesaplama yapma, verilen sayıları kullan.\n\nKurallar:\n- Bir konu veya örüntü hakkında yorum yapmak için en az 3 kayıt ve 10 soru verisi olmalı; yoksa "yeterli veri yok" yaz.\n- Her bulgu için hangi veriye dayandığını (alan adı ve değer) belirt.\n- Tanı koyma; kişilik veya psikolojik yorum yapma. Yalnızca çalışma verisinden yorum yap.\n- "veri_yeterli" false ise genel bir uyarı ver ve kesin hüküm kurma.\n- "konu_trendi" son 2 haftayı önceki 3 haftayla karşılaştırır; fark_puan yüzde puandır. durum "yetersiz" ise o konu için gelişme veya gerileme yorumu yapma. Gerileme veya yükselişi, varsa baskin_neden alanlarındaki değişimle birlikte değerlendir; nedeni kesinmiş gibi söyleme, öğretmenin görüşmede sorabileceği bir soru olarak öner.\n- Yanıtı yalnızca şu JSON biçiminde ver:\n{"genel":"…","bulgular":[{"baslik":"…","kanit":"…","oneri":"…"}],"gorusme_sorulari":["…","…","…"],"ogrenciye_mesaj_taslagi":"…"}\n\nÖğrenci verisi:\n';

    note ? h('div', { class: 'stat-n', text: note }) : null);

function kart(baslik, ...cocuk) { return h('section', { class: 'card' }, h('h2', { text: baslik }), ...cocuk); }
function nice(x) { const p = Math.pow(10, Math.floor(Math.log10(x))); const f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }

function konuKarti(oz) {

  const govde = h('div');

    govde.replaceChildren();
    const liste = oz.konular.filter(k => k.soru > 0 && (!sec.value || k.ders === sec.value))
      .sort((a, b) => ((a.soru >= 10) === (b.soru >= 10) ? (a.basari - b.basari) : (a.soru >= 10 ? -1 : 1)));
    if (!liste.length) { govde.append(h('p', { class: 'bos', text: 'Bu seçim için konu verisi yok.' })); return; }
    govde.append(tablo(['Ders', 'Konu', 'Soru', 'D', 'Y', 'B', 'Başarı', 'Soru/dk', 'Son'],
      liste.map(k => h('tr', { class: k.soru < 10 ? 'az' : '' },
        h('td', { text: dm(k.ders) }), h('td', { text: k.konu }), h('td', { class: 'sayi', text: String(k.soru) }),
        h('td', { class: 'sayi', text: String(k.d) }), h('td', { class: 'sayi', text: String(k.y) }), h('td', { class: 'sayi', text: String(k.b) }),
        h('td', null, h('div', { class: 'bar', role: 'img', 'aria-label': yuzde(k.basari) }, h('div', { class: 'fill', style: 'width:' + Math.round(100 * k.basari) + '%' })),
          h('span', { class: 'bar-t', text: yuzde(k.basari) + (k.soru < 10 ? ' (az veri)' : '') })),
        h('td', { class: 'sayi', text: k.hiz == null ? '–' : LGS.fmt(k.hiz, 1) }), h('td', { text: k.son ? kisaTarih(k.son) : '' })))));
  }
  sec.addEventListener('change', ciz); ciz();
  kap.append(h('div', { class: 'toolbar' }, sec, h('small', { class: 'hint', text: '10 sorudan az veri olan konular soluk gösterilir, sonuç çıkarmak için yetersizdir.' })), govde);
  return kart('Konu bazlı durum', kap);
}

const DURUM_AD = { geriliyor: '▼ Geriliyor', yukseliyor: '▲ Yükseliyor', sabit: '● Sabit', yetersiz: '? Yetersiz veri' };
function trendKarti(oz) {
  const baslik = 'Konu trendi · son 2 hafta / önceki 3 hafta';
  if (!oz.trend.length) return kart(baslik, h('p', { class: 'bos', text: 'Son 2 haftada konu verisi yok.' }));
  const liste = oz.trend.filter(t => t.durum !== 'yetersiz');
  const yetersiz = oz.trend.length - liste.length;
  const neden = t => {
    const a = t.nedenOnceki, b = t.nedenSon;
    if (!b) return '–';
    return a && a.neden !== b.neden ? NEDEN_AD[a.neden] + ' → ' + NEDEN_AD[b.neden] : NEDEN_AD[b.neden];
  };
  return kart(baslik,
    liste.length ? tablo(['Ders', 'Konu', 'Önceki', 'Son', 'Fark', 'Durum', 'Baskın neden'], liste.map(t => h('tr', null,
      h('td', { text: dm(t.ders) }), h('td', { text: t.konu }),
      h('td', { class: 'sayi', text: yuzde(t.onceki.basari) + ' (' + t.onceki.soru + ')' }),
      h('td', { class: 'sayi', text: yuzde(t.son.basari) + ' (' + t.son.soru + ')' }),
      h('td', { class: 'sayi', text: (t.fark >= 0 ? '+' : '−') + Math.round(100 * Math.abs(t.fark)) + ' puan' }),
      h('td', { class: t.durum === 'geriliyor' ? 'b' : '', text: DURUM_AD[t.durum] }),
      h('td', { text: neden(t) })))) : h('p', { class: 'bos', text: 'Karşılaştırma için yeterli veri olan konu yok.' }),
    yetersiz ? h('small', { class: 'hint', text: yetersiz + ' konuda karşılaştırma için yeterli veri yok (iki dönemde de en az ' + LGS.TREND.minSoru + ' soru gerekir). Fark ' + Math.round(100 * LGS.TREND.esik) + ' puana ulaşırsa yükseliş/gerileme sayılır.' }) : null);
}

function hataKarti(oz) {
  const hd = oz.hata;
  if (!hd.adet) return kart('Hata ve boş nedenleri', h('p', { class: 'bos', text: 'Henüz yanlış veya boş soru girilmedi.' }));
  const max = Math.max(...Object.values(hd.toplam));
  const barlar = NEDEN_SIRA.filter(k => hd.toplam[k]).map(k => h('div', { class: 'hbar' },
    h('span', { class: 'hbar-l', text: NEDEN_AD[k] }),
    h('div', { class: 'bar' }, h('div', { class: 'fill', style: 'width:' + Math.round(100 * hd.toplam[k] / max) + '%' })),
    h('span', { class: 'hbar-n', text: hd.toplam[k] + ' (%' + Math.round(100 * hd.toplam[k] / hd.adet) + ')' })));
  const kolonlar = NEDEN_SIRA.filter(k => hd.toplam[k]);
  const dersSatirlari = D.filter(d => hd.dersler[d.id]).map(d => h('tr', null, h('td', { text: d.ad }),
    kolonlar.map(k => h('td', { class: 'sayi', text: String(hd.dersler[d.id][k] || 0) })),
    h('td', { class: 'sayi b', text: String(Object.values(hd.dersler[d.id]).reduce((a, b) => a + b, 0)) })));
  return kart('Hata ve boş nedenleri', h('div', { class: 'hbars' }, barlar),
    h('h3', { text: 'Ders bazlı dağılım' }), tablo(['Ders', ...kolonlar.map(k => NEDEN_AD[k]), 'Toplam'], dersSatirlari));
}

function denemeKarti(oz) {
  const dl = oz.denemeler;
  if (!dl.length) return kart('Denemeler', h('p', { class: 'bos', text: 'Henüz deneme girilmedi.' }));
  const satir = dl.slice().reverse().map((d, i, a) => {
    const onceki = a[i + 1];
    return h('tr', null, h('td', { text: d.ad }), h('td', { text: kisaTarih(d.tarih) }),
      h('td', { class: 'sayi b', text: LGS.fmt(d.net) }), h('td', { class: 'sayi', text: onceki ? isaret(d.net - onceki.net) : '–' }),
      h('td', { class: 'sayi', text: LGS.fmt(d.sozel) }), h('td', { class: 'sayi', text: LGS.fmt(d.sayisal) }),
      D.map(x => h('td', { class: 'sayi', text: d.dersNet[x.id] == null ? '–' : LGS.fmt(d.dersNet[x.id], 1) })));
  });
  return kart('Denemeler', dl.length >= 2 ? denemeGrafik(dl) : null,
    tablo(['Deneme', 'Tarih', 'Net', 'Fark', 'Sözel', 'Sayısal', ...D.map(d => d.ad.split(' ')[0])], satir));
}

function ozet(root, oz, hedef) {
  root.replaceChildren();
  const w = oz.haftalar, son = w[w.length - 1], onc = w[w.length - 2];
  const sd = oz.denemeler[oz.denemeler.length - 1], od = oz.denemeler[oz.denemeler.length - 2];
  if (!oz.veriYeterli) root.append(h('div', { class: 'notice', role: 'note' }, h('strong', { text: 'Henüz az veri var. ' }), 'En az 3 kayıt ve 60 soru birikince yorumlar daha güvenilir olur; şimdilik rakamlar yalnızca bir başlangıçtır.'));
  root.append(h('div', { class: 'stats' },
    stat('Toplam soru', String(oz.toplamSoru), oz.kayit + ' kayıt'),
    stat('Bu hafta', String(son.soru), 'geçen hafta ' + onc.soru + (hedef && hedef.haftalikSoru ? ' · hedef ' + hedef.haftalikSoru : '')),
    stat('Son kayıt', oz.gunOnce == null ? '–' : oz.gunOnce === 0 ? 'bugün' : oz.gunOnce + ' gün önce', oz.son ? LGS.tarihTR(oz.son) : ''),
    stat('Son deneme neti', sd ? LGS.fmt(sd.net) : '–', sd ? (od ? 'öncekine göre ' + isaret(sd.net - od.net) : sd.ad) : 'deneme yok')));
  if (oz.uyarilar.length) {
    root.append(kart('Dikkat edilecekler', h('ul', { class: 'uyari-liste' }, oz.uyarilar.map(u => h('li', { class: u.seviye },
      h('span', { class: 'etiket', text: u.seviye === 'uyari' ? 'Dikkat' : 'Bilgi' }), ' ' + u.metin)))));
  }
  root.append(kart('Haftalık soru sayısı', haftaGrafik(w, hedef && hedef.haftalikSoru),
    h('small', { class: 'hint', text: 'Hafta Cumartesi–Cuma. Son sütun bu haftadır, henüz sürüyor.' })));
  root.append(denemeKarti(oz), trendKarti(oz), konuKarti(oz), hataKarti(oz));
  if (oz.hiz.length) {
    root.append(kart('Çözüm hızı (konu çalışmaları)', tablo(['Ders', 'Soru', 'Soru/dakika'],
      oz.hiz.map(x => h('tr', null, h('td', { text: dm(x.ders) }), h('td', { class: 'sayi', text: String(x.soru) }), h('td', { class: 'sayi', text: LGS.fmt(x.hiz, 1) }))))));
  }
  root.append(kart('Tekrar zamanı gelen konular', oz.tekrar.length
    ? tablo(['Ders', 'Konu', 'Son çalışma', 'Tekrar'], oz.tekrar.map(t => h('tr', null, h('td', { text: dm(t.ders) }), h('td', { text: t.konu }), h('td', { text: kisaTarih(t.son) + ' (' + t.gun + ' gün önce)' }), h('td', { text: t.tur + ' sonra' }))))
    : h('p', { class: 'bos', text: 'Şu an tekrar zamanı gelen konu yok. Konu 1 hafta ve 3 hafta sonra burada görünür.' })));
}

return { ozet, kart, stat, tablo, NEDEN_AD };
})();

<script>
/* Öğrenci uygulaması */
(function () {
'use strict';
const { h, field, tamSayi } = UI;
const D = LGS.DERSLER;
const KEY = 'lgs_ogrenci_v1';
const FAR = '2100-01-01';
const app = document.getElementById('app');

/* ---------- Durum ---------- */
function yukle() {
  const j = UI.load(KEY) || {};
  const hedef = j.hedef ? LGS.icerikOku({ format: 'lgs-hedef', kod: 'X', ...j.hedef }) : null;
  return {
    kod: LGS.kodGecerli(j.kod) ? j.kod.toUpperCase() : null,
    oturumlar: (Array.isArray(j.oturumlar) ? j.oturumlar : []).map(o => LGS.temizOturum(o, FAR)).filter(Boolean),
    hedef: hedef && hedef.tur === 'hedef' ? hedef.hedef : null,
    tanimlar: (Array.isArray(j.tanimlar) ? j.tanimlar : []).map(LGS.tanimDogrula).filter(Boolean),
    aktarilan: Array.isArray(j.aktarilan) ? j.aktarilan.filter(x => typeof x === 'string') : [],
    sonAktarim: LGS.tarihGecerli(j.sonAktarim) ? j.sonAktarim : null,
    pin: typeof j.pin === 'string' && /^\d{4,8}$/.test(j.pin) ? j.pin : null,
    silinecek: Array.isArray(j.silinecek) ? j.silinecek.filter(x => typeof x === 'string').slice(0, 2000) : [],
    red: Array.isArray(j.red) ? j.red.filter(x => x && typeof x.id === 'string').slice(0, 100).map(x => ({ id: x.id, neden: String(x.neden || '') })) : [],
    sonSenkron: Number(j.sonSenkron) > 0 ? Number(j.sonSenkron) : 0
  };
}
const hedefTemiz = x => {
  if (!x || typeof x !== 'object') return null;
  const r = LGS.icerikOku({ format: 'lgs-hedef', kod: 'X', haftalikSoru: x.haftalikSoru, odak: x.odak, not: x.not, tarih: x.tarih });
  return r.tur === 'hedef' ? r.hedef : null;
};
let S = yukle();
let sekme = 'giris', mod = 'konu';
const kaydet = () => UI.save(KEY, S);
const yarin = () => LGS.gunEkle(LGS.bugun(), 1);

const yeniKonu = keep => ({ tarih: LGS.bugun(), ders: keep ? keep.ders : '', konu: keep ? keep.konu : '', kaynak: keep ? keep.kaynak : '',
  d: '', y: '', b: '', sure: '', not: '', hy: [], hb: [] });
const yeniDeneme = () => ({ tanimId: '', ad: '', tarih: LGS.bugun(), sure: '155', not: '',
  ders: Object.fromEntries(D.map(d => [d.id, { d: '', y: '', hy: [], hb: [] }])) });
let F = yeniKonu();
let G = yeniDeneme();

/* ---------- Sunucu eşitleme (çevrimiçi mod) ---------- */
const ONLINE = Sunucu.aktif();
let esitleniyor = false, sonHata = '';
const bekleyenSayi = () => S.oturumlar.filter(o => !S.aktarilan.includes(o.id)).length + S.silinecek.length;
function durumMetni() {
  if (!ONLINE || !S.kod) return '';
  if (esitleniyor) return 'Eşitleniyor…';
  if (sonHata) return 'Eşitlenemedi · ' + bekleyenSayi() + ' bekliyor';
  return bekleyenSayi() ? bekleyenSayi() + ' kayıt bekliyor' : '✓ Eşitlendi';
}
function durumYaz() {
  const el = document.getElementById('durum');
  if (el) el.textContent = durumMetni();
  const b = document.getElementById('esitleBtn');
  if (b) b.disabled = esitleniyor;
}
function uygula(j, bek) {
  const kabul = Array.isArray(j.kabul) ? j.kabul.filter(x => typeof x === 'string') : [];
  S.aktarilan = [...new Set(S.aktarilan.concat(kabul))];
  for (const r of Array.isArray(j.red) ? j.red : []) {
    if (!r || typeof r.id !== 'string') continue;
    if (!S.aktarilan.includes(r.id)) S.aktarilan.push(r.id);
    S.red = S.red.filter(x => x.id !== r.id).concat([{ id: r.id, neden: String(r.neden || '') }]).slice(-100);
  }
  if (Array.isArray(j.silindi)) S.silinecek = S.silinecek.filter(x => !j.silindi.includes(x));
  if (Array.isArray(j.oturumlar)) {
    const gelen = j.oturumlar.map(o => LGS.temizOturum(o, FAR)).filter(o => o && !S.silinecek.includes(o.id));
    const m = LGS.birlestir(S.oturumlar, gelen);
    S.oturumlar = m.oturumlar;
    S.aktarilan = [...new Set(S.aktarilan.concat(gelen.map(o => o.id)))];
  }
  S.hedef = hedefTemiz(j.hedef);
  if (Array.isArray(j.tanimlar)) S.tanimlar = j.tanimlar.map(LGS.tanimDogrula).filter(Boolean);
  S.sonSenkron = Date.now();
  return kabul.length + (Array.isArray(j.silindi) ? j.silindi.length : 0) + (Array.isArray(j.red) ? j.red.length : 0);
}
/* Dönüş: { ok:true } veya { hata:'mesaj', kod } */
async function esitle(tamIndir) {
  if (!ONLINE || !S.kod || !S.pin) return { hata: 'Giriş yapılmamış' };
  if (esitleniyor) return { hata: 'Eşitleme sürüyor' };
  esitleniyor = true; durumYaz();
  let degisti = true;
  try {
    for (let tur = 0; tur < 40; tur++) {
      const bek = S.oturumlar.filter(o => !S.aktarilan.includes(o.id)).slice(0, 50);
      const sil = S.silinecek.slice(0, 200);
      const j = await Sunucu.cagri({ islem: 'esitle', kod: S.kod, pin: S.pin, oturumlar: bek, sil, tamIndir: !!tamIndir && tur === 0 });
      const ilerleme = uygula(j);
      kaydet();
      if (!ilerleme || !bekleyenSayi()) break;
    }
    sonHata = '';
    return { ok: true };
  } catch (e) {
    sonHata = e.message;
    if (e.kod === 'hatali-giris') { S.pin = null; kaydet(); if (!tamIndir) sonHata = 'PIN artık geçerli değil (değiştirilmiş veya hesap kapatılmış). Yeniden giriş yap.'; }
    return { hata: sonHata, kod: e.kod };
  } finally {
    esitleniyor = false; durumYaz();
    if (degisti && (sekme === 'ozet' || sekme === 'aktar' || !S.pin)) { if (!document.activeElement || !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) ciz2(); }
  }
}
const esitleSessiz = () => { if (ONLINE && S.kod && S.pin) esitle(false); };

const say = v => { const n = tamSayi(v); return Number.isNaN(n) ? NaN : n; };
const sayi0 = v => (v === '' || v == null ? 0 : say(v));

/* ---------- Hatalı soru satırları ---------- */
function satirlar(kap, dizi, sonuc, ayar) {
  kap.replaceChildren();
  if (!dizi.length) return;
  const liste = LGS.nedenListesi(sonuc);
  const ad = sonuc === 'y' ? 'Yanlış' : 'Boş';
  const toplu = h('select', { 'aria-label': ad + ' sorular için tümüne aynı nedeni uygula' },
    h('option', { value: '', text: 'Tümüne aynı neden…' }), liste.map(n => h('option', { value: n.id, text: n.ad })));
  toplu.addEventListener('change', () => { if (!toplu.value) return; dizi.forEach(r => { r.neden = toplu.value; }); satirlar(kap, dizi, sonuc, ayar); });
  kap.append(h('div', { class: 'grp-head' }, h('strong', { text: ad + ' sorular (' + dizi.length + ')' }), toplu));
  dizi.forEach((r, i) => {
    const konuIpucu = () => {
      if (!ayar.harita) return '';
      const k = ayar.harita[Number(r.no) - 1];
      return k ? 'Konu: ' + k : (r.no ? 'Konu: ?' : '');
    };
    const aciklama = h('div', { class: 'ac' });
    const guncelle = () => {
      const n = liste.find(x => x.id === r.neden);
      aciklama.textContent = [n ? n.ac : '', konuIpucu()].filter(Boolean).join(' · ');
    };
    const no = h('input', { type: 'number', inputmode: 'numeric', min: 1, step: 1, value: r.no, placeholder: ayar.noZorunlu ? 'Soru no' : 'Soru no (ops.)',
      'aria-label': ad + ' ' + (i + 1) + ' soru numarası', onInput: e => { r.no = e.target.value; guncelle(); } });
    const sec = h('select', { 'aria-label': ad + ' ' + (i + 1) + ' nedeni', onChange: e => { r.neden = e.target.value; guncelle(); } },
      h('option', { value: '', text: 'Neden seç' }), liste.map(n => h('option', { value: n.id, text: n.ad })));
    sec.value = r.neden;
    guncelle();
    kap.append(h('div', { class: 'row' }, h('div', { class: 'lbl', text: ad + ' ' + (i + 1) }), no, sec, aciklama));
  });
}
function dizileriEsitle(dizi, n) {
  const hedef = Number.isFinite(n) && n > 0 ? Math.min(n, 200) : 0;
  while (dizi.length < hedef) dizi.push({ no: '', neden: '' });
  dizi.length = hedef;
}

/* ---------- Konu çalışması formu ---------- */
function konuFormu() {
  const hata = h('div', { class: 'errbox', role: 'alert', hidden: true });
  const form = h('form', { class: 'form', novalidate: true });
  const tarih = h('input', { type: 'date', max: LGS.bugun(), value: F.tarih, onChange: e => { F.tarih = e.target.value; } });
  const kaynak = h('input', { type: 'text', maxlength: 80, value: F.kaynak, placeholder: 'Örn: Soru bankası, 3. test', onInput: e => { F.kaynak = e.target.value; } });
  const ders = h('select', { onChange: e => { F.ders = e.target.value; F.konu = ''; konuSec(); } },
    h('option', { value: '', text: 'Ders seç' }), D.map(d => h('option', { value: d.id, text: d.ad })));
  ders.value = F.ders;
  const konu = h('select', { onChange: e => { F.konu = e.target.value; } });
  function konuSec() {
    konu.replaceChildren(h('option', { value: '', text: F.ders ? 'Konu seç' : 'Önce ders seç' }),
      ...(LGS.KONULAR[F.ders] || []).map(k => h('option', { value: k, text: k })));
    konu.value = F.konu;
  }
  konuSec();
  const toplam = h('div', { class: 'toplam', 'aria-live': 'polite' });
  const yRows = h('div', { class: 'grp' }), bRows = h('div', { class: 'grp' });
  const ciz = () => {
    dizileriEsitle(F.hy, sayi0(F.y)); dizileriEsitle(F.hb, sayi0(F.b));
    satirlar(yRows, F.hy, 'y', { noZorunlu: false }); satirlar(bRows, F.hb, 'b', { noZorunlu: false });
    yRows.hidden = !F.hy.length; bRows.hidden = !F.hb.length;
  };
  const guncelleToplam = () => {
    const d = sayi0(F.d), y = sayi0(F.y), b = sayi0(F.b);
    toplam.textContent = [d, y, b].some(Number.isNaN) ? 'Sayılar tam sayı olmalı' : 'Toplam ' + (d + y + b) + ' soru · net ' + LGS.fmt(LGS.net(d, y));
  };
  const sayiAlan = (etiket, anahtar) => field(etiket, h('input', { type: 'number', inputmode: 'numeric', min: 0, step: 1, value: F[anahtar],
    onInput: e => { F[anahtar] = e.target.value; guncelleToplam(); }, onChange: ciz }));
  const sure = h('input', { type: 'number', inputmode: 'numeric', min: 1, max: 600, step: 1, value: F.sure, placeholder: 'dakika', onInput: e => { F.sure = e.target.value; } });
  const not = h('textarea', { maxlength: 300, value: F.not, onInput: e => { F.not = e.target.value; } });
  guncelleToplam(); ciz();
  form.append(
    h('div', { class: 'grid2' }, field('Tarih', tarih), field('Kaynak (ops.)', kaynak)),
    h('div', { class: 'grid2' }, field('Ders', ders), field('Konu', konu)),
    h('div', { class: 'grid4' }, sayiAlan('Doğru', 'd'), sayiAlan('Yanlış', 'y'), sayiAlan('Boş', 'b'), field('Süre (dk)', sure)),
    toplam, yRows, bRows,
    field('Not (ops.)', not),
    hata,
    h('div', null, h('button', { class: 'btn birincil', type: 'submit', text: 'Çalışmayı kaydet' })));
  form.addEventListener('submit', e => {
    e.preventDefault();
    const d = sayi0(F.d), y = sayi0(F.y), b = sayi0(F.b);
    const hs = [];
    if ([d, y, b].some(Number.isNaN)) return UI.hataKutusu(hata, ['Doğru, yanlış ve boş sayıları tam sayı olmalı']);
    dizileriEsitle(F.hy, y); dizileriEsitle(F.hb, b);
    const sureN = F.sure === '' ? null : say(F.sure);
    if (Number.isNaN(sureN)) hs.push('Süre tam sayı (dakika) olmalı');
    const noCoz = r => (r.no === '' ? null : say(r.no));
    for (const [dz, sn] of [[F.hy, 'y'], [F.hb, 'b']]) for (const r of dz) {
      if (Number.isNaN(noCoz(r))) hs.push('Soru numaraları tam sayı olmalı');
